<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - My Action Bar</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       BAZOWY CSS
       ========================================= */
    :root {
      --bg: #0b0c11; --surface: #13151d; --surface2: #1a1d27;
      --border: #272b3d; --border2: #323654;
      --accent: #eeff70; --accent2: #7ec8ff; --accent3: #ff7eb3;
      --text: #d4d8eb; --text-muted: #5a6080; --text-dim: #8890aa;
      --radius: 12px; --radius-xs: 5px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.5;
      min-height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    }

    /* ─── Header ─── */
    header {
      border-bottom: 1px solid var(--border); padding: 13px 20px;
      display: flex; align-items: center; gap: 14px;
      background: var(--surface); height: 52px; flex-shrink: 0;
      user-select: none; -webkit-user-select: none;
    }

    .logo {
      font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px;
      color: var(--accent); letter-spacing: -.5px; white-space: nowrap;
      display: flex; align-items: center; gap: 8px; text-decoration: none;
    }
    .logo span { color: var(--text-muted); font-weight: 400; line-height: 45px; }

    .badge {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 2px 7px;
      border-radius: 4px; background: rgba(126, 200, 255, .08); color: var(--accent2);
      border: 1px solid rgba(126, 200, 255, .2); white-space: nowrap;
    }

    header .spacer { flex: 1; }

    /* =========================================
       STYLE STRONY 404
       ========================================= */
    .error-view {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 20px; text-align: center;
    }

    .error-code {
      font-family: 'JetBrains Mono', monospace; font-size: 120px; font-weight: 700;
      line-height: 1; margin-bottom: 10px;
      background: linear-gradient(135deg, var(--accent3), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(255, 126, 179, 0.2);
    }

    .error-title {
      font-size: 24px; font-weight: 600; color: #fff; margin-bottom: 16px;
    }

    .error-desc {
      color: var(--text-dim); max-width: 400px; margin: 0 auto 30px; line-height: 1.6;
    }

    .home-btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 24px; background: linear-gradient(135deg, rgba(238, 255, 112, .1), rgba(126, 200, 255, .07));
      border: 1px solid rgba(238, 255, 112, .25); color: var(--accent);
      border-radius: var(--radius-xs); font-family: 'Inter', sans-serif; font-size: 14px;
      font-weight: 700; cursor: pointer; transition: all .15s; text-decoration: none;
    }

    .home-btn:hover {
      background: linear-gradient(135deg, rgba(238, 255, 112, .18), rgba(126, 200, 255, .12));
      transform: translateY(-2px); box-shadow: 0 4px 12px rgba(238, 255, 112, 0.1);
    }

    @media (max-width: 600px) {
      header { flex-wrap: wrap; height: auto; padding: 10px 14px; }
      .error-code { font-size: 80px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <img src="assets/logo.png" alt="" style="height: 24px; border-radius: 4px; display: block; border: none; object-fit: contain;">
      <span>My Action Bar</span>
    </a>
    <div class="badge">Personalize your Action Bar</div>
    <div class="spacer"></div>
  </header>

  <div class="error-view">
    <div>
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">Oops! The page you are looking for has vanished into the Void, or it never existed in the first place.</p>
      <a href="index.html" class="home-btn">Return to Homepage</a>
    </div>
  </div>

</body>
</html>
